name: Daily 10x Commits

on:
  schedule:
    - cron: "0 2 * * *"  # Runs at 2 AM UTC every day
  workflow_dispatch:
    inputs:
      min_commits:
        description: "Minimum number of fake commits to generate"
        required: false
        default: "5"
      max_commits:
        description: "Maximum number of fake commits to generate"
        required: false
        default: "45"

jobs:
  generate_commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Defaults used for the scheduled run; override by triggering this workflow
      # manually ("Run workflow") with custom min_commits / max_commits inputs.
      MIN_COMMITS: ${{ github.event.inputs.min_commits || '20' }}
      MAX_COMMITS: ${{ github.event.inputs.max_commits || '100' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "Pooyan Razian"
          git config --global user.email "prazian@gmail.com"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate commits
        run: |
          YESTERDAY=$(date -d "yesterday" +"%Y-%m-%d")
          python src/generate_commits.py daily --date "$YESTERDAY" --min-commits "$MIN_COMMITS" --max-commits "$MAX_COMMITS"

      - name: Push changes
        run: |
          git pull --rebase
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
